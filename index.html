<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/app_index.js" defer></script>
  </head>
  <body>
    <main class="calendar">
      <div class="container">
        <ul class="months">
          <li data-month="0" class="">
            JAN
            <span class="note-count"></span>
          </li>
          <li data-month="1">
            FEB
            <span class="note-count"></span>
          </li>
          <li data-month="2">
            MAR
            <span class="note-count"></span>
          </li>
          <li data-month="3">
            APR
            <span class="note-count"></span>
          </li>
          <li data-month="4">
            MAY
            <span class="note-count"></span>
          </li>
          <li data-month="5">
            JUN
            <span class="note-count"></span>
          </li>
          <li data-month="6">
            JUL
            <span class="note-count"></span>
          </li>
          <li data-month="7">
            AUG
            <span class="note-count"></span>
          </li>
          <li data-month="8">
            SEP
            <span class="note-count"></span>
          </li>
          <li data-month="9">
            OCT
            <span class="note-count"></span>
          </li>
          <li data-month="10">
            NOV
            <span class="note-count"></span>
          </li>
          <li data-month="11">
            DEC
            <span class="note-count"></span>
          </li>
        </ul>
      </div>
    </main>
    <button id="list-tasks">Listar Tareas</button>
    <button id="clear-tasks">Limpiar Tareas</button>

    <ul id="notes-list">
      <li class="note"></li>
    </ul>
  </body>
</html>
