<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Notas del mes</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script type="module" src="../js/app_month.js" defer></script>
  </head>

  <body>
    <main class="month">
      <h1 id="tituloMes"></h1>

      <form id="formNote">
        <input type="text" id="title" placeholder="Título" />
        <input type="text" id="description" placeholder="Descripcion" />
        <input id="new-note" type="submit" />

        <p id="error"></p>
      </form>

      <ul id="notes-list"></ul>

      <button><a href="../index.html">Volver al calendario</a></button>
    </main>
  </body>
</html>
